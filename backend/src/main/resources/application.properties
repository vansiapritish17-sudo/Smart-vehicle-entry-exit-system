server.port=${PORT:8081}

# Load backend/.env (gitignored) for local development. `optional:` means the app
# still starts without it — on a real deployment the values come from real env vars,
# which take precedence over anything imported here.
spring.config.import=optional:file:./.env[.properties]

# App name
spring.application.name=svems-backend

# Disable Spring Security's default login page — /api/** is guarded by
# FirebaseTokenFilter, which verifies Firebase ID tokens (JWTs) directly.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Paths under /api that skip token verification (comma-separated Ant patterns).
svems.security.public-paths=/api/health

# Routes restricted to the Administrator role (`METHOD:` prefix limits it to one verb).
svems.security.admin-paths=/api/users/**,PUT:/api/configuration,POST:/api/vehicles,PUT:/api/vehicles/**,DELETE:/api/vehicles/**

# Browser origins allowed to call the API. Only needed when the frontend is served
# from a different origin than this server (e.g. the Vite dev server).
svems.cors.allowed-origins=${SVEMS_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Passwords for the bootstrap accounts, used only when the users collection is empty.
svems.auth.admin-password=${SVEMS_ADMIN_PASSWORD:Admin@123}
svems.auth.operator-password=${SVEMS_OPERATOR_PASSWORD:Operator@123}

# Jackson — omit null fields, pretty print
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.indent-output=true

# Logging — reduce Firebase SDK noise
logging.level.com.google.cloud=WARN
logging.level.io.grpc=WARN
logging.level.com.svems=INFO

# Log the security filter's decisions at DEBUG to trace 401s:
#   logging.level.com.svems.security=DEBUG
