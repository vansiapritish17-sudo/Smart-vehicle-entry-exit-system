<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Barbican — vehicle access intelligence. Live gate monitoring, entry/exit control and capacity alerts." />
    <title>Barbican · Vehicle Access Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body style="margin: 0">
    <script>
      // Apply the saved theme before the first paint, so a light-theme user
      // never sees a dark flash while the app loads.
      (function () {
        var theme = "dark";
        try { theme = localStorage.getItem("barbican-theme") || "dark"; } catch (e) {}
        if (theme === "light") document.documentElement.dataset.theme = "light";
        document.body.style.background = theme === "light" ? "#f4f4f5" : "#09090b";
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
